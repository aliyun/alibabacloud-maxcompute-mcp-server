name: Dependency Audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install audit tooling
        run: uv sync --frozen --group dev

      - name: Audit all locked groups and extras
        run: |
          audit_dir=$(mktemp -d)
          uv export --frozen --all-groups --all-extras --no-hashes \
            --no-emit-project --output-file "$audit_dir/requirements.txt"
          uv run --frozen pip-audit --requirement "$audit_dir/requirements.txt" \
            --strict --progress-spinner off
