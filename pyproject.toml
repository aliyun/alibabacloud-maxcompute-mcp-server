[project]
name = "alibabacloud-maxcompute-mcp-server"
version = "0.1.5"
description = "MCP (Model Context Protocol) server for Alibaba Cloud MaxCompute — list projects/schemas/tables, search metadata, execute SQL, and manage instances via Catalog API and PyODPS."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Alibaba Cloud MaxCompute MCP Server Contributors" }
]
keywords = [
  "maxcompute",
  "odps",
  "catalog",
  "mcp",
  "model-context-protocol",
  "alibaba-cloud",
  "alibabacloud",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = [
  "pyodps_catalog>=0.4.0,<0.5",
  "alibabacloud-tea>=0.4.3",  # Alibaba Cloud official Tea framework (not the third-party tea package)
  "alibabacloud_tea_util>=0.3.15",
  "alibabacloud-credentials>=1.0.12",  # Alibaba Cloud credentials SDK, supports default credential chain and ALIBABA_CLOUD_CREDENTIALS_URI (aligned with dataworks-mcp-server)
  "maxcompute_tea_openapi>=1.3.1",
  "maxcompute_tea_util>=0.0.1",
  "mcp>=2.0.0,<3",     # Official MCP Python SDK with 2026-07-28 support
  "httpx2>=2.12.0,<3", # MCP 2.x Streamable HTTP client dependency
  "starlette>=1.6.0,<2", # ASGI surface for the transparent HTTP proxy
  "uvicorn>=0.52.4",   # ASGI server for Streamable HTTP mode
  # Security floors for runtime transitive dependencies. These must be public
  # Requires-Dist entries because PyPI installers do not read [tool.uv].
  "cryptography>=46.0.6",
  "requests>=2.33.0",
  "idna>=3.15",
  "urllib3>=2.7.0",
  "aiohttp>=3.14.0",
]

[project.urls]
Homepage = "https://github.com/aliyun/alibabacloud-maxcompute-mcp-server"
Repository = "https://github.com/aliyun/alibabacloud-maxcompute-mcp-server"
Documentation = "https://github.com/aliyun/alibabacloud-maxcompute-mcp-server#readme"
Issues = "https://github.com/aliyun/alibabacloud-maxcompute-mcp-server/issues"
Changelog = "https://github.com/aliyun/alibabacloud-maxcompute-mcp-server/blob/master/CHANGELOG.md"

[project.optional-dependencies]
local = [
  # Local SDK mode only. Keeping these out of the base install makes the
  # default remote proxy usable without PyArrow or its native wheel.
  "pyodps>=0.13.1",
  "pyarrow>=23.0.1,<26", # GHSA-rgxp-2hwp-jwgg fix.
]
dev = [
  "diff-cover>=10.4.1,<11",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff==0.16.1",
]
# E2E credential proxy: local service uses AK to call STS AssumeRole, provides ALIBABA_CLOUD_CREDENTIALS_URI externally
sts-proxy = ["alibabacloud-sts20150401>=1.2.0"]

[project.scripts]
alibabacloud-maxcompute-mcp-server = "maxcompute_catalog_mcp.server:main"

[dependency-groups]
dev = [
  "anthropic>=0.122.0",
  "diff-cover>=10.4.1,<11",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff==0.16.1",
]

# Default to Alibaba Cloud PyPI mirror; set UV_DEFAULT_INDEX=https://pypi.org/simple/ to use official PyPI
[tool.uv]
# Development-only security floor:
#   pygments: CVE-2026-4539 (Low, ReDoS in GUID regex)
constraint-dependencies = [
  "pygments>=2.20.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maxcompute_catalog_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "--cov=maxcompute_catalog_mcp",
  "--cov-report=term-missing",
  "--cov-report=html:htmlcov",
  "--cov-report=xml:coverage.xml",
  "--cov-config=pyproject.toml",
]

[tool.coverage.run]
source = ["maxcompute_catalog_mcp"]
branch = true
omit = [
  "*/tests/*",
  "*/__main__.py",
]

[tool.coverage.report]
# Coarse aggregate floor for direct pytest runs. CI separately enforces the exact
# 80% line and 90% branch thresholds through scripts/check_coverage.py.
fail_under = 80
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if __name__ == .__main__.",
  "raise NotImplementedError",
  "pass",
  "except ImportError",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "alibabacloud_credentials.*",
  "alibabacloud_tea_util.*",
  "maxcompute_tea_openapi.*",
  "odps.*",
  "pyodps_catalog.*",
]
ignore_missing_imports = true
